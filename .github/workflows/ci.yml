name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dag-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Astro CLI
        run: curl -sSL https://install.astronomer.io | sudo bash -s
      # Construye la imagen (Runtime 3.3 + dbt-oss + Cosmos) y corre tests/dags/*.
      # Esto también valida que el proyecto dbt v2 parsee al renderizar el DAG de Cosmos.
      - name: astro dev pytest
        run: astro dev pytest
